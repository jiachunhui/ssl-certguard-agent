<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="CertGuard Agent 工作原理：TOPSSL.CN 平台与服务器上的 Agent 双向通信，Agent 自动部署证书到 Nginx、Apache、IIS">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <linearGradient id="gradAgent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 背景面板（浅色卡片，亮/暗主题下均清晰） -->
  <rect width="960" height="460" rx="16" fill="#f1f5f9"/>

  <!-- ================= ① TOPSSL.CN 平台（左，缩小） ================= -->
  <!-- 卡片：x=40 w=200 → 右边缘 240 -->
  <rect x="40" y="150" width="200" height="160" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="140" cy="188" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="194" text-anchor="middle" font-size="19" fill="#2563eb">☁</text>
  <text x="140" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">TOPSSL.CN</text>
  <text x="140" y="248" text-anchor="middle" font-size="12" fill="#475569" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">证书管理平台</text>
  <text x="140" y="284" text-anchor="middle" font-size="11" fill="#64748b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">下发签名证书与任务</text>

  <!-- ================= ② Agent（中，收窄） ================= -->
  <!-- 卡片：x=370 w=210 → 右边缘 580 -->
  <rect x="370" y="150" width="210" height="160" rx="14" fill="url(#gradAgent)"/>
  <text x="475" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Agent</text>
  <text x="475" y="222" text-anchor="middle" font-size="13" fill="#e0f2fe" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">你的服务器</text>
  <text x="475" y="284" text-anchor="middle" font-size="11.5" fill="#dbeafe" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">自动检测 · 部署 · 续签 · 自更新</text>

  <!-- ================= ③ Web 服务（右） ================= -->
  <!-- 卡片：x=756 w=170 → 右边缘 926 -->
  <!-- Nginx -->
  <rect x="756" y="35" width="170" height="105" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="841" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Nginx</text>
  <text x="841" y="102" text-anchor="middle" font-size="12" fill="#64748b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Linux · 证书热重载</text>
  <!-- Apache -->
  <rect x="756" y="182.5" width="170" height="105" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="841" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Apache</text>
  <text x="841" y="250" text-anchor="middle" font-size="12" fill="#64748b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Linux · 优雅重载</text>
  <!-- IIS -->
  <rect x="756" y="330" width="170" height="105" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="841" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">IIS</text>
  <text x="841" y="397" text-anchor="middle" font-size="12" fill="#64748b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Windows · HTTP.sys 即时生效</text>

  <!-- ================= 通信箭头（全部放入卡片间隙） ================= -->
  <!-- ① 心跳 + 拉取任务（Agent → 平台，线 y=185，标注 y=170 在间隙内） -->
  <line x1="369" y1="185" x2="244" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="306" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">① 心跳 + 拉取任务</text>

  <!-- ④ 上报结果（Agent → 平台，线 y=265，标注 y=286 在间隙内） -->
  <line x1="369" y1="265" x2="244" y2="265" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="306" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">④ 上报结果</text>

  <!-- ② 写入证书 / ③ 校验并重载（Agent → Web 服务）
       主干线 x=665，② 文字在左（y=210），③ 文字在右（y=245），均位于间隙 580~756 内 -->
  <line x1="584" y1="225" x2="665" y2="225" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <line x1="665" y1="87.5" x2="665" y2="382.5" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="665" y1="87.5" x2="752" y2="87.5" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <line x1="665" y1="225" x2="752" y2="225" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <line x1="665" y1="382.5" x2="752" y2="382.5" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="657" y="212" text-anchor="end" font-size="12" font-weight="600" fill="#0891b2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">② 写入证书</text>
  <text x="665" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#0891b2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">③ 校验并重载</text>

  <!-- 底部说明 -->
  <text x="480" y="442" text-anchor="middle" font-size="12.5" fill="#64748b" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Agent 周期性主动与平台通信（60s 心跳），私钥始终留在服务器本地，平台仅下发签名证书</text>
</svg>
